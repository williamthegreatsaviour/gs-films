pluginManagement {
    // 1. FORMA MODERNA: Usa FLUTTER_ROOT
    def flutterSdkPath = System.getenv("FLUTTER_ROOT")
    if (flutterSdkPath == null) {
        throw new GradleException("Flutter SDK not found. Define FLUTTER_ROOT environment variable!")
    }

    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// 2. BLOQUE PLUGIN MODERNO: Usa el plugin de Flutter
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0" apply false
    id "com.android.application" version "8.7.0" apply false // Usa tu versión de AGP (8.7.0)
    id "org.jetbrains.kotlin.android" version "1.9.23" apply false // Versión moderna de Kotlin para Android
}

include ":app"
