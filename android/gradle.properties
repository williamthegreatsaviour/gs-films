# CONFIGURACIÓN DE MEMORIA DE GRADLE
# Aumenta el heap de la JVM de Gradle para compilaciones más grandes o más rápidas
org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# Las banderas obsoletas android.useAndroidX y android.enableJetifier han sido ELIMINADAS.
